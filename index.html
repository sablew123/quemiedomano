<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chiqys</title>
<style>
:root{box-sizing:border-box;--ink:#2b2240;--pop:#ff7aa8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:"Trebuchet MS",system-ui,sans-serif}
canvas{display:block;position:fixed;inset:0}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0) 16px env(safe-area-inset-bottom,0);text-align:center}
#menu{justify-content:flex-start;padding-top:12vh}
h1{font-size:clamp(3rem,12vw,7rem);margin:0;color:#fff;letter-spacing:.06em;text-shadow:0 6px 0 var(--pop),0 10px 20px rgba(0,0,0,.25)}
.sub{color:var(--ink);font-weight:700;margin:6px 0 24px}
button{font:inherit;font-weight:800;font-size:1.3rem;padding:14px 38px;border:0;border-radius:999px;background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 5px 0 var(--pop);transition:transform .1s}
button:hover{transform:translateY(-2px)}button:active{transform:translateY(3px);box-shadow:0 2px 0 var(--pop)}
#cap{position:fixed;left:0;right:0;bottom:calc(8vh + env(safe-area-inset-bottom,0px));text-align:center;color:#fff;font-size:clamp(1.1rem,3.4vw,1.9rem);font-weight:700;padding:0 20px;text-shadow:0 2px 8px #000,0 0 3px #000;opacity:0;transition:opacity .8s;pointer-events:none}
#cap.on{opacity:1}
#blk{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .4s}
#skip{position:fixed;right:14px;top:calc(12px + env(safe-area-inset-top,0px));font-size:.9rem;padding:8px 18px;display:none;opacity:.7}
#end{display:none;background:rgba(0,0,0,.55);color:#fff}
#end h2{font-size:clamp(2rem,7vw,3.6rem);margin:0 0 20px;font-weight:700}
#hud{position:fixed;left:14px;top:calc(12px + env(safe-area-inset-top,0px));color:#fff;font-weight:800;text-shadow:0 2px 6px #000;opacity:.9;line-height:1.6;font-size:1.05rem}
#diary{background:rgba(0,0,0,.84);color:#fff;justify-content:flex-start;padding-top:10vh;overflow:auto}#diary p{max-width:34rem;margin:.5rem 0}
#paper{position:fixed;left:50%;bottom:0;width:min(88vw,27rem);transform:translate(-50%,115%) rotate(-2deg);background:#f3e9cf;color:#3b2f26;font:italic 1.15rem/1.6 Georgia,serif;padding:22px 26px 34px;border-radius:4px 4px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.6);transition:transform .7s cubic-bezier(.2,.8,.2,1);pointer-events:none}#paper.on{transform:translate(-50%,6%) rotate(-2deg)}#paper p{margin:0 0 8px}#paper small{opacity:.6;font-style:normal}
.hide{display:none!important}
</style>
</head>
<body>
<div id="menu" class="ov"><h1>CHIQYS</h1><p class="sub">un juego muy tierno</p><button id="play">New Game</button></div>
<div id="cap"></div><div id="blk"></div><div id="hud" class="hide"></div><div id="diary" class="ov hide"></div><div id="paper"></div>
<button id="skip">Saltar ›</button>
<div id="end" class="ov"><h2>Continuará…</h2><button id="back">Volver al menú</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
const DAY=new THREE.Color(0xbfe8ff),NIGHT=new THREE.Color(0x020204);
scene.background=DAY.clone();scene.fog=new THREE.Fog(0xbfe8ff,14,40);
const cam=new THREE.PerspectiveCamera(50,1,.1,100);
const amb=new THREE.AmbientLight(0xffffff,.9);scene.add(amb);
const sun=new THREE.DirectionalLight(0xffffff,.9);sun.position.set(4,8,6);scene.add(sun);
const spot=new THREE.SpotLight(0xfff0b8,0,40,.32,.55,1);scene.add(spot,spot.target);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshStandardMaterial({color:0x9be39b,roughness:1}));
ground.rotation.x=-Math.PI/2;scene.add(ground);

const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.7});
function mkFace(fm){
  const f=new THREE.Group();
  [-1,1].forEach(s=>{ // ojo: media cápsula (domo con base plana)
    const e=new THREE.Group();
    e.add(new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,.08,12),fm));
    const d=new THREE.Mesh(new THREE.SphereGeometry(.06,12,8,0,Math.PI*2,0,Math.PI/2),fm);d.position.y=.04;e.add(d);
    e.position.set(s*.27,.06,0);f.add(e);
  });
  [-1,1].forEach(s=>{ // boca :3
    const m=new THREE.Mesh(new THREE.TorusGeometry(.085,.022,8,14,Math.PI),fm);
    m.rotation.z=Math.PI;m.position.set(s*.085,-.04,.03);f.add(m);
  });
  f.position.z=.86;return f;
}
function hat(type,c){
  const g=new THREE.Group(),m=M(c);
  if(type==='cap'){
    const d=new THREE.Mesh(new THREE.SphereGeometry(.62,16,8,0,Math.PI*2,0,Math.PI/2),m);d.position.y=.62;g.add(d);
    const b=new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,.05,16,1,false,0,Math.PI),m);b.position.set(0,.64,.3);b.rotation.y=Math.PI/2;g.add(b);
  }else if(type==='cone'){
    const k=new THREE.Mesh(new THREE.ConeGeometry(.55,1.1,16),m);k.position.y=1.2;g.add(k);
  }else if(type==='beret'){
    const b=new THREE.Mesh(new THREE.CylinderGeometry(.65,.55,.2,20),m);b.position.set(-.1,.8,0);b.rotation.z=.15;g.add(b);
    const n=new THREE.Mesh(new THREE.SphereGeometry(.07,8,8),m);n.position.set(-.18,.93,0);g.add(n);
  }else{
    const t=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.75,20),m);t.position.y=1.15;g.add(t);
    const r=new THREE.Mesh(new THREE.CylinderGeometry(.72,.72,.06,20),m);r.position.y=.8;g.add(r);
    const bd=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.14,20),M(0xd33a3a));bd.position.y=.92;g.add(bd);
  }
  return g;
}
function mkChar(body,hc,type,x){
  const g=new THREE.Group(),fm=new THREE.MeshBasicMaterial({color:0x151515});
  const b=new THREE.Mesh(new THREE.SphereGeometry(.9,28,22),M(body));g.add(b);
  g.add(mkFace(fm),hat(type,hc));
  g.position.set(x,.9,0);scene.add(g);
  return{g,fm,x,ph:Math.random()*6,alive:true};
}
const verdy=mkChar(0xa8e6a1,0x2e9e4a,'cap',-3.15);
const azuly=mkChar(0xa5c8ff,0x2f5fd0,'cone',-1.05);
const rojy =mkChar(0xff9a9a,0xc62828,'beret',1.05);
const blanqy=mkChar(0xffffff,0x1c1c1c,'top',3.15);
const chars=[verdy,azuly,rojy,blanqy];

// Bandeja + mano de mamá (solo mano y comida)
const handG=new THREE.Group(),tray=new THREE.Group();
const skin=M(0xffd2b0);
const plate=new THREE.Mesh(new THREE.CylinderGeometry(1,1,.1,32),M(0xfff4e0));plate.scale.set(3.9,1,.9);tray.add(plate);
const foods=[];
[[0xe53935,'s'],[0xffa726,'s'],[0xffe082,'b'],[0xf48fb1,'c']].forEach((f,i)=>{
  const geo=f[1]==='b'?new THREE.BoxGeometry(.6,.5,.6):f[1]==='c'?new THREE.ConeGeometry(.35,.6,12):new THREE.SphereGeometry(.38,16,12);
  const m=new THREE.Mesh(geo,M(f[0]));m.position.set(chars[i].x,.4,0);tray.add(m);foods.push(m);
});
tray.position.y=.35;handG.add(tray);
const palm=new THREE.Mesh(new THREE.SphereGeometry(.5,16,12),skin);palm.scale.set(1,.35,.9);handG.add(palm);
for(let i=0;i<4;i++){const fg=new THREE.Mesh(new THREE.SphereGeometry(.12,10,8),skin);fg.scale.set(1,1,2);fg.position.set(-.3+i*.2,0,.5);handG.add(fg);}
const arm=new THREE.Mesh(new THREE.CylinderGeometry(.24,.24,14,12),skin);arm.rotation.z=Math.PI/2;arm.position.x=7.3;handG.add(arm);
const cuff=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,1.4,14),M(0xff8fb8));cuff.rotation.z=Math.PI/2;cuff.position.x=1.2;handG.add(cuff);
handG.position.set(16,.5,2.5);scene.add(handG);

// estado
let started=false,T=0,fired=0,trayFell=false,shake=0,dark=0,shot=null;
const camBase=new THREE.Vector3(),camLook=new THREE.Vector3(0,1.1,0),_v1=new THREE.Vector3(),_v2=new THREE.Vector3(),_v3=new THREE.Vector3();
const evs=[
 [.6,()=>say('El mundo de Chiqys era simple.')],
 [4.5,()=>say('Todos los días, mamá les daba de comer.')],
 [9.5,()=>say('Porque cada uno tenía su propia idea de la mucha hambre…')],
 [13.5,()=>{shot=verdy;say('Verdy aseguraba: «Si no como, voy a explotar de hambre».');}],
 [17.5,()=>{shot=azuly;say('Azuly aseguraba: «Si no como, me comeré lo que sea».');}],
 [21.5,()=>{shot=rojy;say('Rojy aseguraba: «Si no como, voy a gritar hasta que se me quite».');}],
 [25.5,()=>{shot=blanqy;say('Y Blanqy: «Aguanto… pero dejo de reír y de emocionarme».');}],
 [29.5,()=>{shot=null;say('Pero un día, mamá desapareció.');}],
 [34,()=>say('El pueblo se nubló en oscuridad.')],
 [38,()=>say('Y el hambre pasó de mucha… a demasiada.')],
 [41.8,()=>{say('');blk(1);}],
 [42.5,()=>{verdy.g.visible=rojy.g.visible=false;verdy.alive=rojy.alive=false;azuly.fm.color.setHex(0xfff2a8);shake=1;}],
 [43.7,()=>{blk(0);say('Solo quedan Blanqy y una linterna.');}],
 [47.5,()=>say('Algo se acerca… y alguien grita desde dentro.')],
 [51.5,()=>say('Encuentra las notas de mamá.')],
 [55.5,()=>startGame()]
];
let capT;
function say(t){const c=$('cap');c.classList.remove('on');clearTimeout(capT);if(!t)return;capT=setTimeout(()=>{c.textContent=t;c.classList.add('on')},350);}
function blk(v){$('blk').style.opacity=v;}
function setDark(k){
  amb.intensity=.9-.8*k;sun.intensity=.9*(1-k);
  scene.background.copy(DAY).lerp(NIGHT,k);scene.fog.color.copy(scene.background);
  scene.fog.far=40-28*k;
}
const lerp=(a,b,t)=>a+(b-a)*Math.min(1,t);

$('play').onclick=()=>{started=true;T=0;fired=0;$('menu').classList.add('hide');$('skip').style.display='block';
  try{aud=new AudioContext();const o=aud.createOscillator(),l=aud.createOscillator(),lg=aud.createGain();o.type='sawtooth';o.frequency.value=640;l.frequency.value=8;lg.gain.value=120;l.connect(lg);lg.connect(o.frequency);vol=aud.createGain();vol.gain.value=0;o.connect(vol);spk=aud.createPanner();spk.panningModel='HRTF';spk.rolloffFactor=0;spk.connect(aud.destination);lp=aud.createBiquadFilter();lp.type='lowpass';lp.frequency.value=20000;lp.connect(spk);vol.connect(lp);if(location.protocol.slice(0,4)==='http'){try{aud.createMediaElementSource(grito).connect(lp);}catch(e){}}o.start();l.start();initAudio();aud.resume();}catch(e){}
  grito.volume=0;grito.play().catch(()=>{});};
$('skip').onclick=()=>{T=Math.max(T,55.5);};
$('back').onclick=()=>location.reload();

function resize(){
  const w=innerWidth,h=innerHeight;renderer.setSize(w,h);cam.aspect=w/h;
  camBase.set(0,1.8,8.5*Math.max(1,1.7/cam.aspect));cam.position.copy(camBase);cam.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();

// ===== Juego en primera persona =====
let game=false,over=false,yaw=0,pitch=0,got=0,aud,vol,spk,az3=0,ba=0,back=false,lp,eat=0,pops=1,hudS='';
const pl=new THREE.Vector3(0,1,6),keys={},notes=[],dir=new THREE.Vector3(),hudEl=$('hud');
const NT=['«Mamá salió un ratito. Hay comida en la casa del farol. Si Azuly pregunta, díganle que ya voy». — mamá','«Encontré el borde del pueblo. Hay una puerta, Blanqy. Sigue la luz». — mamá','«Ya casi terminamos el capítulo. Falta poquito, aguanten». — mamá','«Hoy se acabó la temporada. Nadie vino a apagar las luces». — mamá','«No hay salida, Blanqy. Nunca la hubo.»'];
let diaryOpen=false,brk=0,D;const found=[];
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Tab'){e.preventDefault();toggleDiary();}if(e.code==='KeyE'&&game&&!over&&!diaryOpen)useDoor();});addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('mousedown',e=>{if(e.button===2)back=true;if(e.button===0)throwPop();});addEventListener('mouseup',e=>{if(e.button===2)back=false;});addEventListener('contextmenu',e=>e.preventDefault());addEventListener('blur',()=>back=false);
addEventListener('mousemove',e=>{if(document.pointerLockElement){yaw-=e.movementX*.0025;pitch=Math.max(-1.2,Math.min(1.2,pitch-e.movementY*.0025));}});

  NP.forEach(([x,z,b])=>{const n=new THREE.Mesh(new THREE.BoxGeometry(.5,.03,.4),new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xffffff,emissiveIntensity:.8}));n.position.set(x,.3,z);if(b){const bm=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,40,6),new THREE.MeshBasicMaterial({color:0xfff3c4,transparent:true,opacity:.35,fog:false}));bm.position.y=20;n.add(bm);}scene.add(n);notes.push(n);});

  [[-8,-6],[18,-8],[-30,-36],[HX+4,HZ+3.5],[HX-4,HZ-3.5],[-14,-50],[34,-44]].forEach(([x,z],i)=>{const m=mkPop([0xff5fa2,0xffd23f,0x5fd0ff][i%3]);m.position.set(x,.55,z);scene.add(m);pickups.push({m,x,z});});
  hudEl.classList.remove('hide');hudEl.textContent='Notas 0/5';
  say('Busca los rayos de luz · WASD mover · Shift correr · clic en la pantalla · E puertas · Tab diario · clic: lanzar paleta · clic der.: mirar atrás');setTimeout(()=>{if(!got)say('')},7000);
  renderer.domElement.addEventListener('click',()=>{if(!over)renderer.domElement.requestPointerLock();});
}
function caught(){over=true;blk(1);say('Azuly te alcanzó…');setTimeout(()=>{pl.set(0,1,6);yaw=pitch=0;azuly.g.position.set(0,.9,-170);over=false;blk(0);say('')},2800);}
function win(){over=true;document.exitPointerLock();say('');hudEl.classList.add('hide');if(vol)vol.gain.value=0;grito.pause();$('end').style.display='flex';}
function updateGame(dt,t){
  if(diaryOpen)return;
  if(!over){
    const f=!!(keys.KeyW||keys.ArrowUp)-!!(keys.KeyS||keys.ArrowDown),s=!!(keys.KeyD||keys.ArrowRight)-!!(keys.KeyA||keys.ArrowLeft),ln=Math.hypot(f,s)||1,sp=(keys.ShiftLeft?5.2:3.2)*dt/ln;
    pl.x+=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*sp;pl.z+=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*sp;
    if(f||s){stepD+=sp*ln;const run=keys.ShiftLeft;if(stepD>(run?2.2:1.7)){stepD=0;stepSnd(run);}}
    push(pl,.35);const r=Math.hypot(pl.x,pl.z);if(r>105){pl.x*=105/r;pl.z*=105/r;}
    const a=azuly.g.position,dx=pl.x-a.x,dz=pl.z-a.z,d=Math.hypot(dx,dz)||1,za=zone(a),zpl=zone(pl);
    let tgt=pl,bd=1e9;lures.forEach(l=>{const q=Math.hypot(l.x-a.x,l.z-a.z);if(q<bd){bd=q;tgt=l;}});
    if(eat>0)eat-=dt;else if(tgt!==pl&&bd<1.2){eat=1.8;scene.remove(tgt.m);lures.splice(lures.indexOf(tgt),1);thud(a.x,a.z,.6);}
    const v=eat>0?0:(3.9+got*.1)*dt,zp=zone(tgt);
    let tx=tgt.x,tz=tgt.z;
    if(zp!==za){const fw=zp>za,q=D[fw?za+1:za],pass=fw?a.z<q.z:a.z>q.z;tx=q.x;tz=(Math.abs(a.x-q.x)<.8||pass)?(fw?q.in:q.out):(fw?q.out:q.in);
      if(!q.dr.open&&Math.hypot(a.x-q.x,a.z-q.z)<2.6){const o=brk;brk+=dt;if(Math.floor(brk*2)!==Math.floor(o*2))thud(q.x,q.z,1.6);if(brk>4){brk=0;q.dr.broken=true;setDoor(q.dr,true);}}}
    else brk=0;
    const mx=tx-a.x,mz=tz-a.z,md=Math.hypot(mx,mz)||1;a.x+=mx/md*v;a.z+=mz/md*v;az3+=v;if(az3>2.4){az3=0;thud(a.x,a.z);}
    const nn=push(a,.8);if(nn){const sg=Math.sign(-nn.z*mx+nn.x*mz)||1;a.x+=-nn.z*sg*v;a.z+=nn.x*sg*v;push(a,.8);}
    a.y=.9+Math.abs(Math.sin(t*6))*.08;azuly.g.lookAt(tgt.x,.9,tgt.z);
    {const k=Math.max(0,1-d/60);if(gritoOk)grito.volume=Math.min(1,k);else if(vol)vol.gain.setTargetAtTime(k*.15,aud.currentTime,.1);}
    if(lp)lp.frequency.setTargetAtTime(za!==zpl?500:20000,aud.currentTime,.15);if(d<1.6&&zpl===za)caught();
    const nd=nearDoor(),hs='Cartas '+'✉ '.repeat(got)+'▫ '.repeat(5-got)+'<br>🍭 x'+pops+(nd?'<br>[E] puerta':'');if(hs!==hudS){hudS=hs;hudEl.innerHTML=hs;}
    notes.forEach(n=>{if(!n.visible)return;n.rotation.y+=dt;n.position.y=.3+Math.sin(t*2+n.position.x)*.08;
      if(Math.hypot(n.position.x-pl.x,n.position.z-pl.z)<1.5){n.visible=false;got++;const tx=NT[got-1];found.push(tx);pops++;showPaper(tx);if(got==5)setTimeout(win,9000);}});
  }
  for(let i=shots.length-1;i>=0;i--){const sh=shots[i],m=sh.m;sh.v.y-=14*dt;m.position.addScaledVector(sh.v,dt);const q={x:m.position.x,z:m.position.z};if(push(q,.12)){m.position.x=q.x;m.position.z=q.z;sh.v.x=sh.v.z=0;}if(m.position.y<=.14){m.position.y=.14;shots.splice(i,1);lures.push({x:m.position.x,z:m.position.z,m});}}
  pickups.forEach(p=>{if(!p.m.visible)return;p.m.rotation.y+=dt*2;p.m.position.y=.55+Math.sin(t*2+p.x)*.05;if(!over&&Math.hypot(p.x-pl.x,p.z-pl.z)<1.3){p.m.visible=false;pops++;}});
  cam.position.set(pl.x,1+(keys.KeyW?Math.sin(t*9)*.03:0),pl.z);ba=lerp(ba,back?Math.PI:0,dt*14);cam.rotation.set(pitch,yaw+ba,0,'YXZ');
  dir.set(0,0,-1).applyEuler(cam.rotation);const rg=_v1.set(Math.cos(yaw+ba),0,-Math.sin(yaw+ba));
  spot.position.copy(cam.position).addScaledVector(rg,.18);spot.position.y-=.2;
  spot.target.position.copy(cam.position).addScaledVector(dir,10);spot.target.position.y-=1.3;near.position.copy(cam.position);
  const L=aud&&aud.listener;if(L){const c=cam.position;if(L.positionX){L.positionX.value=c.x;L.positionY.value=c.y;L.positionZ.value=c.z;L.forwardX.value=dir.x;L.forwardY.value=dir.y;L.forwardZ.value=dir.z;L.upX.value=0;L.upY.value=1;L.upZ.value=0;}else{L.setPosition(c.x,c.y,c.z);L.setOrientation(dir.x,dir.y,dir.z,0,1,0);}if(spk)setPos(spk,azuly.g.position.x,1,azuly.g.position.z);}
}
const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  if(game){updateGame(dt,t);renderer.render(scene,cam);return;}
  if(started){T+=dt;while(fired<evs.length&&T>=evs[fired][0]){evs[fired++][1]();if(game)return;}}
  // rebote idle
  chars.forEach(c=>{
    if(!c.alive)return;
    const b=Math.abs(Math.sin(t*2.2+c.ph));
    c.g.position.y=.9+b*.1*(T>13?.4:1);
    c.g.scale.set(1+(1-b)*.04,1-(1-b)*.04,1);
    c.g.rotation.z=0;if(T<42.5){c.g.position.x=c.x;c.g.position.z=0;}
  });
  // mano y comida
  if(started){
    if(T<29.5){handG.position.x=lerp(handG.position.x,T>4?0:16,dt*2.5);}
    else{handG.position.x+=dt*30;
      if(!trayFell){trayFell=true;scene.attach(tray);}
    }
    if(T>9.5&&T<13){
      const k=(T-9.5)/3.5;
      foods.forEach(f=>f.scale.setScalar(Math.max(.01,1-k)));
      chars.forEach((c,i)=>{const s=Math.sin(T*10+i)*.07;c.g.scale.set(1+s,1-s,1);});
    }
    if(T>=13)foods.forEach(f=>f.visible=false);
    // planos: lo que cada uno aseguraba
    if(T>=13.5&&T<17.5){const k=(T-13.5)/4;verdy.g.scale.setScalar(1+k*.4+Math.sin(T*50)*.02*k);}
    if(T>=17.5&&T<21.5){azuly.g.position.z=Math.abs(Math.sin((T-17.5)*3.5))*1.4;const s=Math.sin(T*16)*.1;azuly.g.scale.set(1+s,1-s,1+s);}
    if(T>=21.5&&T<25.5){rojy.g.position.x=rojy.x+Math.sin(T*70)*.06;rojy.g.rotation.z=Math.sin(T*50)*.1;rojy.g.scale.setScalar(1+Math.abs(Math.sin(T*18))*.08);}
    if(T>=25.5&&T<29.5){blanqy.g.position.y=.9;blanqy.g.scale.set(1,1,1);}
    if(trayFell){tray.position.y=lerp(tray.position.y,.05,dt*6);tray.rotation.z=lerp(tray.rotation.z,.3,dt*5);}
    // oscuridad
    if(T>=29.5){dark=T<32?(Math.sin(T*40)>0?.35:.95):1;setDark(dark);}
    // linterna
    if(T>=34){spot.intensity=lerp(spot.intensity,T>=41.8&&T<43.7?0:2.2,dt*4);}
    // Blanqy solo
    if(T>=42.5){
      blanqy.g.position.x=lerp(blanqy.g.position.x,0,dt*1.5);
      blanqy.g.position.z=lerp(blanqy.g.position.z,3,dt*1.5);
      const az=Math.min(-1.2,-8+(T-42.5)*.55);
      azuly.g.position.x=Math.sin(t*3)*.08;azuly.g.position.z=az;
      azuly.g.position.y=.9+Math.abs(Math.sin(t*6))*.08;
    }
    spot.position.set(-1.5,2,camBase.z-.5);spot.target.position.copy(blanqy.g.position);
  }
  const sz=camBase.z*.42-(shot===blanqy&&T>25.5?(T-25.5)*.25:0);
  cam.position.lerp(shot?_v1.set(shot.g.position.x,1.3,sz):camBase,dt*3);
  camLook.lerp(shot?_v2.set(shot.g.position.x,1.2,0):_v3.set(0,1.1,0),dt*3);
  if(shake>0){shake-=dt;cam.position.x+=(Math.random()-.5)*.25*shake;}
  cam.lookAt(camLook);
  renderer.render(scene,cam);
}
loop();
</script>
